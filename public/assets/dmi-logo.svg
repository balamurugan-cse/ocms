<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 120" width="580" height="120">
  <defs>
    <linearGradient id="logoNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051329"/>
      <stop offset="40%" stop-color="#0c2552"/>
      <stop offset="75%" stop-color="#143a75"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="logoGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="20%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="crossMiniGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="flameMini" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <path id="miniLogoTopArc" d="M 18,60 A 42,42 0 0,1 102,60" fill="none"/>
    <path id="miniLogoBottomArc" d="M 22,60 A 38,38 0 0,0 98,60" fill="none"/>
  </defs>

  <!-- Left Emblem Group -->
  <g id="crestMini">
    <!-- Outer Shield -->
    <circle cx="60" cy="60" r="56" fill="url(#logoNavyGrad)"/>
    <circle cx="60" cy="60" r="53.5" fill="none" stroke="url(#logoGoldGrad)" stroke-width="2.2"/>
    <circle cx="60" cy="60" r="50.5" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.5"/>
    <circle cx="60" cy="60" r="37.5" fill="#ffffff" stroke="url(#logoGoldGrad)" stroke-width="1.8"/>

    <!-- Arc text -->
    <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="6.2" fill="#ffffff" letter-spacing="0.8">
      <textPath href="#miniLogoTopArc" startOffset="50%" text-anchor="middle">
        DMI COLLEGE OF ENGINEERING
      </textPath>
    </text>
    <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="5" fill="#fef08a" letter-spacing="0.7">
      <textPath href="#miniLogoBottomArc" startOffset="50%" text-anchor="middle">
        PALANCHUR • ESTD 2001
      </textPath>
    </text>

    <!-- Mini Stars -->
    <polygon points="60,7 61,9 63,9 61.5,10.5 62,12.5 60,11.5 58,12.5 58.5,10.5 57,9 59,9" transform="translate(-45, 52) scale(0.6)" fill="url(#logoGoldGrad)"/>
    <polygon points="60,7 61,9 63,9 61.5,10.5 62,12.5 60,11.5 58,12.5 58.5,10.5 57,9 59,9" transform="translate(45, 52) scale(0.6)" fill="url(#logoGoldGrad)"/>

    <!-- Gear -->
    <g transform="translate(60, 48) scale(0.24)">
      <g fill="#1e3a8a">
        <rect x="-10" y="-72" width="20" height="18" rx="3"/>
        <rect x="-10" y="-72" width="20" height="18" rx="3" transform="rotate(30)"/>
        <rect x="-10" y="-72" width="20" height="18" rx="3" transform="rotate(60)"/>
        <rect x="-10" y="-72" width="20" height="18" rx="3" transform="rotate(90)"/>
        <rect x="-10" y="-72" width="20" height="18" rx="3" transform="rotate(120)"/>
        <rect x="-10" y="-72" width="20" height="18" rx="3" transform="rotate(150)"/>
        <rect x="-10" y="-72" width="20" height="18" rx="3" transform="rotate(180)"/>
        <rect x="-10" y="-72" width="20" height="18" rx="3" transform="rotate(210)"/>
        <rect x="-10" y="-72" width="20" height="18" rx="3" transform="rotate(240)"/>
        <rect x="-10" y="-72" width="20" height="18" rx="3" transform="rotate(270)"/>
        <rect x="-10" y="-72" width="20" height="18" rx="3" transform="rotate(300)"/>
        <rect x="-10" y="-72" width="20" height="18" rx="3" transform="rotate(330)"/>
        <circle cx="0" cy="0" r="62" fill="#1e3a8a"/>
      </g>
      <circle cx="0" cy="0" r="46" fill="#ffffff" stroke="url(#logoGoldGrad)" stroke-width="3"/>
    </g>

    <!-- Central Cross -->
    <g transform="translate(60, 47) scale(0.25)">
      <rect x="-6" y="-45" width="12" height="60" rx="2" fill="url(#crossMiniGrad)" stroke="#b45309" stroke-width="1.5"/>
      <rect x="-24" y="-28" width="48" height="12" rx="2" fill="url(#crossMiniGrad)" stroke="#b45309" stroke-width="1.5"/>
      <circle cx="0" cy="-22" r="3.5" fill="#ffffff"/>
    </g>

    <!-- Birds -->
    <g transform="translate(48, 42) scale(0.18)">
      <path d="M 0,0 C 8,-12 24,-14 30,-8 C 22,-2 14,0 0,0 Z" fill="#1e3a8a"/>
    </g>
    <g transform="translate(72, 42) scale(-0.18, 0.18)">
      <path d="M 0,0 C 8,-12 24,-14 30,-8 C 22,-2 14,0 0,0 Z" fill="#1e3a8a"/>
    </g>

    <!-- Open Book -->
    <g transform="translate(60, 68) scale(0.24)">
      <path d="M -66,12 Q -34,-4 0,6 Q 34,-4 66,12 L 60,34 Q 30,18 0,24 Q -30,18 -60,34 Z" fill="#1e3a8a"/>
      <path d="M -64,9 Q -34,-7 -2,3 L -2,22 Q -32,12 -58,28 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <path d="M 64,9 Q 34,-7 2,3 L 2,22 Q 32,12 58,28 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <line x1="0" y1="4" x2="0" y2="25" stroke="#d97706" stroke-width="3"/>
    </g>

    <!-- Lamp flame -->
    <g transform="translate(60, 58) scale(0.26)">
      <path d="M -16,6 C -14,2 -6,-1 0,0 C 6,-1 14,2 16,6 C 16,10 10,12 0,12 C -10,12 -16,10 -16,6 Z" fill="url(#logoGoldGrad)"/>
      <path d="M 0,-24 C 6,-15 7,-7 5,-3 C 3,2 -3,2 -5,-3 C -7,-7 -6,-15 0,-24 Z" fill="url(#flameMini)"/>
      <path d="M 0,-18 C 3,-12 4,-6 3,-3 C 1,-1 -1,-1 -3,-3 C -4,-6 -3,-12 0,-18 Z" fill="#ffffff"/>
    </g>

    <!-- Center DMI Pill -->
    <rect x="42" y="78" width="36" height="11" rx="5.5" fill="#1e3a8a" stroke="url(#logoGoldGrad)" stroke-width="0.8"/>
    <text x="60" y="86.2" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="6.8" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      DMI
    </text>
  </g>

  <!-- Typography Lockup Right -->
  <g transform="translate(132, 0)">
    <text x="0" y="38" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#051329" letter-spacing="0.8">
      DMI COLLEGE OF ENGINEERING
    </text>
    <text x="0" y="58" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="11.5" fill="#1e3a8a" letter-spacing="1.5">
      PALANCHUR, CHENNAI – 600 123 • ESTD 2001
    </text>
    <line x1="0" y1="67" x2="435" y2="67" stroke="#e2e8f0" stroke-width="1.5"/>
    <g transform="translate(0, 76)">
      <rect x="0" y="0" width="76" height="18" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="38" y="12.5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="9" fill="#1e3a8a" text-anchor="middle" letter-spacing="0.8">
        DMI OCMS
      </text>
      <text x="85" y="13.5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="12" fill="#0f172a" letter-spacing="0.5">
        ONLINE COMPLAINT MANAGEMENT SYSTEM
      </text>
    </g>
    <text x="0" y="110" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="9.5" fill="#64748b">
      Anna University Affiliated · AICTE Approved · Contact: grievance@dmice.ac.in
    </text>
  </g>
</svg>